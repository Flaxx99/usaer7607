{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="container mt-5">
  <h2 class="text-danger">⚠️ Confirmar eliminación</h2>
  <p>¿Estás segura de que deseas eliminar el expediente de <strong>{{ object.alumno }}</strong>?</p>
  <p class="text-muted">Esta acción es irreversible y también eliminará los archivos físicos asociados.</p>

  <form method="post" class="delete-form">
    {% csrf_token %}
    <a href="{% url 'documentos:lista_expedientes' %}" class="btn btn-secondary">
      ↩️ Cancelar
    </a>
    <button type="submit" class="btn btn-danger">
      🗑️ Sí, eliminar
    </button>
  </form>
</div>
{% endblock %}
