{% extends "base.html" %}
{% load crispy_forms_tags %}
{% load group_filters %}
  
{% block content %}
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h3 class="card-title mb-0">
            <i class="fas fa-file-signature me-2"></i>{{ titulo }}
          </h3>
        </div>
        <div class="card-body">
          <form method="post" novalidate>
            {% csrf_token %}
            {{ form|crispy }}
            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
              <button type="submit" class="btn btn-success">
                <i class="fas fa-paper-plane me-1"></i> Enviar solicitud
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const tipoPermisoSelect = document.getElementById('id_tipo');
        const horasSolicitadasDiv = document.getElementById('div_id_horas_solicitadas');

        function toggleHorasSolicitadas() {
            const selectedTipo = tipoPermisoSelect.value;
            if (selectedTipo === 'LLEGADA_TARDE' || selectedTipo === 'SALIDA_TEMPRANA') {
                horasSolicitadasDiv.style.display = 'block';
            } else {
                horasSolicitadasDiv.style.display = 'none';
            }
        }

        // Ejecutar al cargar la página
        toggleHorasSolicitadas();

        // Ejecutar al cambiar la selección
        tipoPermisoSelect.addEventListener('change', toggleHorasSolicitadas);
    });
</script>
{% endblock %}
