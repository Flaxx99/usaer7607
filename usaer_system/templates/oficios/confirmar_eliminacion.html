{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
  <h2 class="text-danger">⚠️ Confirmar eliminación</h2>
  <p>¿Estás segura de que deseas eliminar el oficio <strong>{{ oficio.titulo }}</strong>?</p>
  <p class="text-muted">Esta acción es irreversible y también eliminará el archivo físico.</p>

  <form method="post" class="delete-form">
    {% csrf_token %}
    <a href="{% url 'oficios:lista_oficios' %}" class="btn btn-secondary">
      ↩️ Cancelar
    </a>
    <button type="submit" class="btn btn-danger">
      🗑️ Sí, eliminar
    </button>
  </form>
</div>
{% endblock %}
