{% load static %}
{% load crispy_forms_tags %}
{% load group_filters %}
{% load i18n %}
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Gestor USAER 7607{% endblock %}</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Soft UI Dashboard CSS -->
  <link href="{% static 'soft-ui-dashboard/assets/css/soft-ui-dashboard.css' %}" rel="stylesheet" />
  <link href="{% static 'css/main_styles.css' %}" rel="stylesheet" />
  
  <!-- Iconos -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Calendario -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/locales-all.global.min.js"></script>

  <!-- Toastr y SweetAlert2 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Soft UI Dashboard JS -->
  <script src="{% static 'soft-ui-dashboard/assets/js/core/popper.min.js' %}"></script>
  <script src="{% static 'soft-ui-dashboard/assets/js/core/bootstrap.min.js' %}"></script>
  <script src="{% static 'soft-ui-dashboard/assets/js/plugins/perfect-scrollbar.min.js' %}"></script>
  <script src="{% static 'soft-ui-dashboard/assets/js/plugins/smooth-scrollbar.min.js' %}"></script>
  <script src="{% static 'soft-ui-dashboard/assets/js/soft-ui-dashboard.min.js' %}"></script>

  {% block extra_css %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">
  {% block content %}{% endblock %}

  <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

  <!-- Toastr para mensajes Django -->
  <script>
    $(document).ready(function() {
        {% if messages %}
            {% for message in messages %}
                toastr.options = {
                    "closeButton": true,
                    "progressBar": true,
                    "positionClass": "toast-top-right",
                    "timeOut": "4000"
                };
                toastr["{{ message.tags|default:'info' }}"]("{{ message|escapejs }}");
            {% endfor %}
        {% endif %}
    });
  </script>

  {% block extra_js %}{% endblock %}
</body>
</html>
