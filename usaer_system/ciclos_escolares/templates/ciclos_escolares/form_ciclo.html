{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% load i18n %}

{% block title %}{{ current_page_title }}{% endblock %}

{% block content %}
<div class="card shadow mb-4">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">{{ current_page_title }}</h6>
    </div>
    <div class="card-body">
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary">{% trans 'Guardar' %}</button>
            <a href="{% url 'ciclos_escolares:lista_ciclos' %}" class="btn btn-secondary ms-2">{% trans 'Cancelar' %}</a>
        </form>
    </div>
</div>
{% endblock %}
